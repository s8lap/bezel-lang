name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        # clang/LLVM per CLAUDE.md's "Build toolchain" section. (The reference
        # toolchain is Fedora's; this runner installs the equivalent clang via
        # apt. Revisit when codegen starts linking LLVM and version parity with
        # Fedora's LLVM matters.)
        run: sudo apt-get update && sudo apt-get install -y cmake clang llvm ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DBEZEL_WERROR=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

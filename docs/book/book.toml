# mdBook configuration for the Bezel documentation site.
# The pages are GENERATED by scripts/build_book.py from the documents in docs/;
# this file and theme/ are copied next to them. Build: scripts/build_book.py
[book]
title = "The Bezel Language"
language = "en"
src = "src"

[build]
build-dir = "html"
create-missing = false

[output.html]
git-repository-url = "https://github.com/s8lap/bezel-lang"
edit-url-template = ""
additional-js = ["theme/bezel-highlight.js"]
no-section-label = true

[output.html.fold]
enable = true
level = 0

[output.html.search]
enable = true
heading-split-level = 2
limit-results = 40

# The rationale and the changelog stay readable but are left out of the search
# index, which would otherwise exceed 20 MB.
[output.html.search.chapter]
"rationale" = { enable = false }
"changelog" = { enable = false }

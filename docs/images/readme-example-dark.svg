<svg xmlns="http://www.w3.org/2000/svg" width="738" height="888" viewBox="0 0 738 888" role="img" aria-label="Bezel code example">
<rect width="100%" height="100%" rx="6" fill="#151b23"/>
<text font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.6" xml:space="preserve" fill="#f0f6fc">
<tspan x="16" y="28"><tspan fill="#ff7b72">module</tspan> <tspan fill="#d2a8ff">Shapes</tspan>;</tspan>
<tspan x="16" y="48"></tspan>
<tspan x="16" y="68"><tspan fill="#9198a1">//</tspan><tspan fill="#9198a1"> A sum type: each value is exactly one of the cases.</tspan></tspan>
<tspan x="16" y="88"><tspan fill="#ff7b72">public</tspan> <tspan fill="#ff7b72">choice</tspan> <tspan fill="#d2a8ff">Shape</tspan></tspan>
<tspan x="16" y="108">    <tspan fill="#d2a8ff">Circle</tspan>(radius: <tspan fill="#ff7b72">double</tspan>),</tspan>
<tspan x="16" y="128">    <tspan fill="#d2a8ff">Rectangle</tspan>(width: <tspan fill="#ff7b72">double</tspan>, height: <tspan fill="#ff7b72">double</tspan>),</tspan>
<tspan x="16" y="148">    <tspan fill="#d2a8ff">Dot</tspan>;  <tspan fill="#9198a1">//</tspan><tspan fill="#9198a1"> a case with no payload</tspan></tspan>
<tspan x="16" y="168"><tspan fill="#ff7b72">end</tspan> <tspan fill="#d2a8ff">Shape</tspan>;</tspan>
<tspan x="16" y="188"></tspan>
<tspan x="16" y="208"><tspan fill="#ff7b72">public</tspan> <tspan fill="#ff7b72">class</tspan> <tspan fill="#d2a8ff">Program</tspan></tspan>
<tspan x="16" y="228">    <tspan fill="#9198a1">//</tspan><tspan fill="#9198a1"> `case` as an expression. The compiler checks that every case is covered.</tspan></tspan>
<tspan x="16" y="248">    <tspan fill="#ff7b72">public</tspan> <tspan fill="#ff7b72">static</tspan> <tspan fill="#ff7b72">method</tspan> <tspan fill="#d2a8ff">Area</tspan>(s: <tspan fill="#d2a8ff">Shape</tspan>): <tspan fill="#ff7b72">double</tspan> =&gt; (<tspan fill="#ff7b72">case</tspan> s of</tspan>
<tspan x="16" y="268">        <tspan fill="#d2a8ff">Circle</tspan>(<tspan fill="#ff7b72">var</tspan> r) =&gt; <tspan fill="#d2a8ff">Math</tspan>.<tspan fill="#d2a8ff">Pi</tspan> * r * r,</tspan>
<tspan x="16" y="288">        <tspan fill="#d2a8ff">Rectangle</tspan>(<tspan fill="#ff7b72">var</tspan> w, <tspan fill="#ff7b72">var</tspan> h) =&gt; w * h,</tspan>
<tspan x="16" y="308">        <tspan fill="#d2a8ff">Dot</tspan> =&gt; <tspan fill="#79c0ff">0.0</tspan>);</tspan>
<tspan x="16" y="328"></tspan>
<tspan x="16" y="348">    <tspan fill="#ff7b72">public</tspan> <tspan fill="#ff7b72">static</tspan> <tspan fill="#ff7b72">method</tspan> <tspan fill="#d2a8ff">Main</tspan>()</tspan>
<tspan x="16" y="368">        <tspan fill="#ff7b72">var</tspan> shapes: <tspan fill="#d2a8ff">Array</tspan>&lt;<tspan fill="#d2a8ff">Shape</tspan>&gt; := [</tspan>
<tspan x="16" y="388">            <tspan fill="#d2a8ff">Shape</tspan>.<tspan fill="#d2a8ff">Circle</tspan>(<tspan fill="#79c0ff">1.0</tspan>),</tspan>
<tspan x="16" y="408">            <tspan fill="#d2a8ff">Shape</tspan>.<tspan fill="#d2a8ff">Rectangle</tspan>(<tspan fill="#79c0ff">2.0</tspan>, <tspan fill="#79c0ff">3.0</tspan>),</tspan>
<tspan x="16" y="428">            <tspan fill="#d2a8ff">Shape</tspan>.<tspan fill="#d2a8ff">Dot</tspan>,</tspan>
<tspan x="16" y="448">            <tspan fill="#d2a8ff">Shape</tspan>.<tspan fill="#d2a8ff">Rectangle</tspan>(<tspan fill="#79c0ff">4.0</tspan>, <tspan fill="#79c0ff">4.0</tspan>)</tspan>
<tspan x="16" y="468">        ];</tspan>
<tspan x="16" y="488"></tspan>
<tspan x="16" y="508">        <tspan fill="#9198a1">//</tspan><tspan fill="#9198a1"> A function value. The lambda's parameter type comes from the declared type.</tspan></tspan>
<tspan x="16" y="528">        <tspan fill="#ff7b72">var</tspan> describe: (<tspan fill="#d2a8ff">Shape</tspan>) -&gt; <tspan fill="#ff7b72">string</tspan> := <tspan fill="#ff7b72">lambda</tspan>(s) =&gt; (<tspan fill="#ff7b72">case</tspan> s of</tspan>
<tspan x="16" y="548">            <tspan fill="#d2a8ff">Circle</tspan>(<tspan fill="#ff7b72">var</tspan> r) =&gt; <tspan fill="#a5d6ff">$"</tspan><tspan fill="#a5d6ff">circle of radius </tspan><tspan fill="#a5d6ff">{</tspan>r<tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff">"</tspan>,</tspan>
<tspan x="16" y="568">            <tspan fill="#d2a8ff">Rectangle</tspan>(<tspan fill="#ff7b72">var</tspan> w, <tspan fill="#ff7b72">var</tspan> h) =&gt;</tspan>
<tspan x="16" y="588">                (<tspan fill="#ff7b72">if</tspan> w = h <tspan fill="#ff7b72">then</tspan> <tspan fill="#a5d6ff">$"</tspan><tspan fill="#a5d6ff">square of side </tspan><tspan fill="#a5d6ff">{</tspan>w<tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff">"</tspan> <tspan fill="#ff7b72">else</tspan> <tspan fill="#a5d6ff">$"</tspan><tspan fill="#a5d6ff">rectangle </tspan><tspan fill="#a5d6ff">{</tspan>w<tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff"> by </tspan><tspan fill="#a5d6ff">{</tspan>h<tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff">"</tspan>),</tspan>
<tspan x="16" y="608">            <tspan fill="#d2a8ff">Dot</tspan> =&gt; <tspan fill="#a5d6ff">"</tspan><tspan fill="#a5d6ff">dot</tspan><tspan fill="#a5d6ff">"</tspan>);</tspan>
<tspan x="16" y="628"></tspan>
<tspan x="16" y="648">        <tspan fill="#ff7b72">for</tspan> <tspan fill="#ff7b72">var</tspan> s <tspan fill="#ff7b72">in</tspan> shapes <tspan fill="#ff7b72">do</tspan></tspan>
<tspan x="16" y="668">            <tspan fill="#d2a8ff">Console</tspan>.<tspan fill="#d2a8ff">WriteLine</tspan>(<tspan fill="#a5d6ff">$"</tspan><tspan fill="#a5d6ff">{</tspan>describe(s)<tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff">: area </tspan><tspan fill="#a5d6ff">{</tspan><tspan fill="#d2a8ff">Area</tspan>(s):<tspan fill="#d2a8ff">F2</tspan><tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff">"</tspan>);</tspan>
<tspan x="16" y="688">        <tspan fill="#ff7b72">end</tspan>;</tspan>
<tspan x="16" y="708"></tspan>
<tspan x="16" y="728">        <tspan fill="#9198a1">//</tspan><tspan fill="#9198a1"> The first lambda captures the local `threshold`.</tspan></tspan>
<tspan x="16" y="748">        <tspan fill="#ff7b72">var</tspan> threshold := <tspan fill="#79c0ff">5.0</tspan>;</tspan>
<tspan x="16" y="768">        <tspan fill="#ff7b72">var</tspan> large := shapes.<tspan fill="#d2a8ff">Where</tspan>(<tspan fill="#ff7b72">lambda</tspan>(s) =&gt; <tspan fill="#d2a8ff">Area</tspan>(s) &gt; threshold).<tspan fill="#d2a8ff">Count</tspan>();</tspan>
<tspan x="16" y="788">        <tspan fill="#ff7b72">var</tspan> total := shapes.<tspan fill="#d2a8ff">Select</tspan>(<tspan fill="#ff7b72">lambda</tspan>(s) =&gt; <tspan fill="#d2a8ff">Area</tspan>(s)).<tspan fill="#d2a8ff">Sum</tspan>();</tspan>
<tspan x="16" y="808">        <tspan fill="#d2a8ff">Console</tspan>.<tspan fill="#d2a8ff">WriteLine</tspan>(<tspan fill="#a5d6ff">$"</tspan><tspan fill="#a5d6ff">{</tspan>large<tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff"> of </tspan><tspan fill="#a5d6ff">{</tspan>shapes.<tspan fill="#d2a8ff">Count</tspan><tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff"> shapes exceed </tspan><tspan fill="#a5d6ff">{</tspan>threshold<tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff">"</tspan>);</tspan>
<tspan x="16" y="828">        <tspan fill="#d2a8ff">Console</tspan>.<tspan fill="#d2a8ff">WriteLine</tspan>(<tspan fill="#a5d6ff">$"</tspan><tspan fill="#a5d6ff">total area </tspan><tspan fill="#a5d6ff">{</tspan>total:<tspan fill="#d2a8ff">F2</tspan><tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff">"</tspan>);</tspan>
<tspan x="16" y="848">    <tspan fill="#ff7b72">end</tspan> <tspan fill="#d2a8ff">Main</tspan>;</tspan>
<tspan x="16" y="868"><tspan fill="#ff7b72">end</tspan> <tspan fill="#d2a8ff">Program</tspan>;</tspan>
</text>
</svg>

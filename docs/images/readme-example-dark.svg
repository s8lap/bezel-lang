<svg xmlns="http://www.w3.org/2000/svg" width="729" height="608" viewBox="0 0 729 608" role="img" aria-label="Bezel code example">
<rect width="100%" height="100%" rx="6" fill="#151b23"/>
<text font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.6" xml:space="preserve" fill="#f0f6fc">
<tspan x="16" y="28"><tspan fill="#ff7b72">module</tspan> <tspan fill="#d2a8ff">Demo</tspan>;</tspan>
<tspan x="16" y="48"></tspan>
<tspan x="16" y="68"><tspan fill="#ff7b72">public</tspan> <tspan fill="#ff7b72">class</tspan> <tspan fill="#d2a8ff">Conn</tspan>(name: <tspan fill="#ff7b72">string</tspan>)</tspan>
<tspan x="16" y="88">  <tspan fill="#ff7b72">public</tspan> <tspan fill="#ff7b72">method</tspan> <tspan fill="#d2a8ff">Send</tspan>(text: <tspan fill="#ff7b72">string</tspan>) =&gt; <tspan fill="#d2a8ff">Console</tspan>.<tspan fill="#d2a8ff">WriteLine</tspan>(<tspan fill="#a5d6ff">$"</tspan><tspan fill="#a5d6ff">{</tspan>name<tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff"> &lt;- </tspan><tspan fill="#a5d6ff">{</tspan>text<tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff">"</tspan>);</tspan>
<tspan x="16" y="108">  <tspan fill="#ff7b72">destructor</tspan></tspan>
<tspan x="16" y="128">    <tspan fill="#d2a8ff">Console</tspan>.<tspan fill="#d2a8ff">WriteLine</tspan>(<tspan fill="#a5d6ff">$"</tspan><tspan fill="#a5d6ff">{</tspan>name<tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff"> closed</tspan><tspan fill="#a5d6ff">"</tspan>);</tspan>
<tspan x="16" y="148">  <tspan fill="#ff7b72">end</tspan> <tspan fill="#d2a8ff">destructor</tspan>;</tspan>
<tspan x="16" y="168"><tspan fill="#ff7b72">end</tspan> <tspan fill="#d2a8ff">Conn</tspan>;</tspan>
<tspan x="16" y="188"></tspan>
<tspan x="16" y="208"><tspan fill="#ff7b72">public</tspan> <tspan fill="#ff7b72">choice</tspan> <tspan fill="#d2a8ff">Reply</tspan></tspan>
<tspan x="16" y="228">  <tspan fill="#d2a8ff">Page</tspan>(body: <tspan fill="#ff7b72">string</tspan>), <tspan fill="#d2a8ff">Failed</tspan>(code: <tspan fill="#ff7b72">int</tspan>);</tspan>
<tspan x="16" y="248"><tspan fill="#ff7b72">end</tspan> <tspan fill="#d2a8ff">Reply</tspan>;</tspan>
<tspan x="16" y="268"></tspan>
<tspan x="16" y="288"><tspan fill="#ff7b72">public</tspan> <tspan fill="#ff7b72">class</tspan> <tspan fill="#d2a8ff">Program</tspan></tspan>
<tspan x="16" y="308">  <tspan fill="#ff7b72">public</tspan> <tspan fill="#ff7b72">static</tspan> <tspan fill="#ff7b72">method</tspan> <tspan fill="#d2a8ff">Main</tspan>()</tspan>
<tspan x="16" y="328">    <tspan fill="#ff7b72">using</tspan> <tspan fill="#ff7b72">var</tspan> db := <tspan fill="#ff7b72">new</tspan> <tspan fill="#d2a8ff">Conn</tspan>(<tspan fill="#a5d6ff">"</tspan><tspan fill="#a5d6ff">db</tspan><tspan fill="#a5d6ff">"</tspan>);            <tspan fill="#9198a1">//</tspan><tspan fill="#9198a1"> closed as Main exits, on every path</tspan></tspan>
<tspan x="16" y="348">    <tspan fill="#ff7b72">using</tspan> <tspan fill="#ff7b72">var</tspan> pool := <tspan fill="#ff7b72">new</tspan> <tspan fill="#d2a8ff">OwningArray</tspan>&lt;<tspan fill="#d2a8ff">Conn</tspan>&gt;();</tspan>
<tspan x="16" y="368">    <tspan fill="#ff7b72">var</tspan> cache := <tspan fill="#ff7b72">new</tspan> <tspan fill="#d2a8ff">Conn</tspan>(<tspan fill="#a5d6ff">"</tspan><tspan fill="#a5d6ff">cache</tspan><tspan fill="#a5d6ff">"</tspan>);</tspan>
<tspan x="16" y="388">    pool.<tspan fill="#d2a8ff">Add</tspan>(<tspan fill="#ff7b72">move</tspan> cache);                      <tspan fill="#9198a1">//</tspan><tspan fill="#9198a1"> the pool owns it now</tspan></tspan>
<tspan x="16" y="408"></tspan>
<tspan x="16" y="428">    <tspan fill="#ff7b72">var</tspan> replies: <tspan fill="#d2a8ff">Array</tspan>&lt;<tspan fill="#d2a8ff">Reply</tspan>&gt; := [<tspan fill="#d2a8ff">Reply</tspan>.<tspan fill="#d2a8ff">Page</tspan>(<tspan fill="#a5d6ff">"</tspan><tspan fill="#a5d6ff">home</tspan><tspan fill="#a5d6ff">"</tspan>), <tspan fill="#d2a8ff">Reply</tspan>.<tspan fill="#d2a8ff">Failed</tspan>(<tspan fill="#79c0ff">503</tspan>)];</tspan>
<tspan x="16" y="448">    <tspan fill="#ff7b72">for</tspan> <tspan fill="#ff7b72">var</tspan> r <tspan fill="#ff7b72">in</tspan> replies <tspan fill="#ff7b72">do</tspan></tspan>
<tspan x="16" y="468">      db.<tspan fill="#d2a8ff">Send</tspan>((<tspan fill="#ff7b72">case</tspan> r <tspan fill="#ff7b72">of</tspan>                       <tspan fill="#9198a1">//</tspan><tspan fill="#9198a1"> a new Reply case is flagged here</tspan></tspan>
<tspan x="16" y="488">          <tspan fill="#d2a8ff">Page</tspan>(<tspan fill="#ff7b72">var</tspan> body) =&gt; body,</tspan>
<tspan x="16" y="508">          <tspan fill="#d2a8ff">Failed</tspan>(<tspan fill="#ff7b72">var</tspan> code) =&gt; <tspan fill="#a5d6ff">$"</tspan><tspan fill="#a5d6ff">error </tspan><tspan fill="#a5d6ff">{</tspan>code<tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff">"</tspan>));</tspan>
<tspan x="16" y="528">    <tspan fill="#ff7b72">end</tspan>;</tspan>
<tspan x="16" y="548">    <tspan fill="#d2a8ff">Console</tspan>.<tspan fill="#d2a8ff">WriteLine</tspan>(<tspan fill="#a5d6ff">$"</tspan><tspan fill="#a5d6ff">port </tspan><tspan fill="#a5d6ff">{</tspan><tspan fill="#ff7b72">int</tspan>.<tspan fill="#d2a8ff">ParseOrNull</tspan>(<tspan fill="#a5d6ff">"</tspan><tspan fill="#a5d6ff">80x</tspan><tspan fill="#a5d6ff">"</tspan>) ?? <tspan fill="#79c0ff">8080</tspan><tspan fill="#a5d6ff">}</tspan><tspan fill="#a5d6ff">"</tspan>);</tspan>
<tspan x="16" y="568">  <tspan fill="#ff7b72">end</tspan> <tspan fill="#d2a8ff">Main</tspan>;                                    <tspan fill="#9198a1">//</tspan><tspan fill="#9198a1"> pool closes cache, then db closes</tspan></tspan>
<tspan x="16" y="588"><tspan fill="#ff7b72">end</tspan> <tspan fill="#d2a8ff">Program</tspan>;</tspan>
</text>
</svg>

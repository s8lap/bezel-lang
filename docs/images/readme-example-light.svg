<svg xmlns="http://www.w3.org/2000/svg" width="729" height="608" viewBox="0 0 729 608" role="img" aria-label="Bezel code example">
<rect width="100%" height="100%" rx="6" fill="#f6f8fa"/>
<text font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.6" xml:space="preserve" fill="#1f2328">
<tspan x="16" y="28"><tspan fill="#cf222e">module</tspan> <tspan fill="#8250df">Demo</tspan>;</tspan>
<tspan x="16" y="48"></tspan>
<tspan x="16" y="68"><tspan fill="#cf222e">public</tspan> <tspan fill="#cf222e">class</tspan> <tspan fill="#8250df">Conn</tspan>(name: <tspan fill="#cf222e">string</tspan>)</tspan>
<tspan x="16" y="88">  <tspan fill="#cf222e">public</tspan> <tspan fill="#cf222e">method</tspan> <tspan fill="#8250df">Send</tspan>(text: <tspan fill="#cf222e">string</tspan>) =&gt; <tspan fill="#8250df">Console</tspan>.<tspan fill="#8250df">WriteLine</tspan>(<tspan fill="#0a3069">$"</tspan><tspan fill="#0a3069">{</tspan>name<tspan fill="#0a3069">}</tspan><tspan fill="#0a3069"> &lt;- </tspan><tspan fill="#0a3069">{</tspan>text<tspan fill="#0a3069">}</tspan><tspan fill="#0a3069">"</tspan>);</tspan>
<tspan x="16" y="108">  <tspan fill="#cf222e">destructor</tspan></tspan>
<tspan x="16" y="128">    <tspan fill="#8250df">Console</tspan>.<tspan fill="#8250df">WriteLine</tspan>(<tspan fill="#0a3069">$"</tspan><tspan fill="#0a3069">{</tspan>name<tspan fill="#0a3069">}</tspan><tspan fill="#0a3069"> closed</tspan><tspan fill="#0a3069">"</tspan>);</tspan>
<tspan x="16" y="148">  <tspan fill="#cf222e">end</tspan> <tspan fill="#8250df">destructor</tspan>;</tspan>
<tspan x="16" y="168"><tspan fill="#cf222e">end</tspan> <tspan fill="#8250df">Conn</tspan>;</tspan>
<tspan x="16" y="188"></tspan>
<tspan x="16" y="208"><tspan fill="#cf222e">public</tspan> <tspan fill="#cf222e">choice</tspan> <tspan fill="#8250df">Reply</tspan></tspan>
<tspan x="16" y="228">  <tspan fill="#8250df">Page</tspan>(body: <tspan fill="#cf222e">string</tspan>), <tspan fill="#8250df">Failed</tspan>(code: <tspan fill="#cf222e">int</tspan>);</tspan>
<tspan x="16" y="248"><tspan fill="#cf222e">end</tspan> <tspan fill="#8250df">Reply</tspan>;</tspan>
<tspan x="16" y="268"></tspan>
<tspan x="16" y="288"><tspan fill="#cf222e">public</tspan> <tspan fill="#cf222e">class</tspan> <tspan fill="#8250df">Program</tspan></tspan>
<tspan x="16" y="308">  <tspan fill="#cf222e">public</tspan> <tspan fill="#cf222e">static</tspan> <tspan fill="#cf222e">method</tspan> <tspan fill="#8250df">Main</tspan>()</tspan>
<tspan x="16" y="328">    <tspan fill="#cf222e">using</tspan> <tspan fill="#cf222e">var</tspan> db := <tspan fill="#cf222e">new</tspan> <tspan fill="#8250df">Conn</tspan>(<tspan fill="#0a3069">"</tspan><tspan fill="#0a3069">db</tspan><tspan fill="#0a3069">"</tspan>);            <tspan fill="#59636e">//</tspan><tspan fill="#59636e"> closed as Main exits, on every path</tspan></tspan>
<tspan x="16" y="348">    <tspan fill="#cf222e">using</tspan> <tspan fill="#cf222e">var</tspan> pool := <tspan fill="#cf222e">new</tspan> <tspan fill="#8250df">OwningArray</tspan>&lt;<tspan fill="#8250df">Conn</tspan>&gt;();</tspan>
<tspan x="16" y="368">    <tspan fill="#cf222e">var</tspan> cache := <tspan fill="#cf222e">new</tspan> <tspan fill="#8250df">Conn</tspan>(<tspan fill="#0a3069">"</tspan><tspan fill="#0a3069">cache</tspan><tspan fill="#0a3069">"</tspan>);</tspan>
<tspan x="16" y="388">    pool.<tspan fill="#8250df">Add</tspan>(<tspan fill="#cf222e">move</tspan> cache);                      <tspan fill="#59636e">//</tspan><tspan fill="#59636e"> the pool owns it now</tspan></tspan>
<tspan x="16" y="408"></tspan>
<tspan x="16" y="428">    <tspan fill="#cf222e">var</tspan> replies: <tspan fill="#8250df">Array</tspan>&lt;<tspan fill="#8250df">Reply</tspan>&gt; := [<tspan fill="#8250df">Reply</tspan>.<tspan fill="#8250df">Page</tspan>(<tspan fill="#0a3069">"</tspan><tspan fill="#0a3069">home</tspan><tspan fill="#0a3069">"</tspan>), <tspan fill="#8250df">Reply</tspan>.<tspan fill="#8250df">Failed</tspan>(<tspan fill="#0550ae">503</tspan>)];</tspan>
<tspan x="16" y="448">    <tspan fill="#cf222e">for</tspan> <tspan fill="#cf222e">var</tspan> r <tspan fill="#cf222e">in</tspan> replies <tspan fill="#cf222e">do</tspan></tspan>
<tspan x="16" y="468">      db.<tspan fill="#8250df">Send</tspan>((<tspan fill="#cf222e">case</tspan> r <tspan fill="#cf222e">of</tspan>                       <tspan fill="#59636e">//</tspan><tspan fill="#59636e"> a new Reply case is flagged here</tspan></tspan>
<tspan x="16" y="488">          <tspan fill="#8250df">Page</tspan>(<tspan fill="#cf222e">var</tspan> body) =&gt; body,</tspan>
<tspan x="16" y="508">          <tspan fill="#8250df">Failed</tspan>(<tspan fill="#cf222e">var</tspan> code) =&gt; <tspan fill="#0a3069">$"</tspan><tspan fill="#0a3069">error </tspan><tspan fill="#0a3069">{</tspan>code<tspan fill="#0a3069">}</tspan><tspan fill="#0a3069">"</tspan>));</tspan>
<tspan x="16" y="528">    <tspan fill="#cf222e">end</tspan>;</tspan>
<tspan x="16" y="548">    <tspan fill="#8250df">Console</tspan>.<tspan fill="#8250df">WriteLine</tspan>(<tspan fill="#0a3069">$"</tspan><tspan fill="#0a3069">port </tspan><tspan fill="#0a3069">{</tspan><tspan fill="#cf222e">int</tspan>.<tspan fill="#8250df">ParseOrNull</tspan>(<tspan fill="#0a3069">"</tspan><tspan fill="#0a3069">80x</tspan><tspan fill="#0a3069">"</tspan>) ?? <tspan fill="#0550ae">8080</tspan><tspan fill="#0a3069">}</tspan><tspan fill="#0a3069">"</tspan>);</tspan>
<tspan x="16" y="568">  <tspan fill="#cf222e">end</tspan> <tspan fill="#8250df">Main</tspan>;                                    <tspan fill="#59636e">//</tspan><tspan fill="#59636e"> pool closes cache, then db closes</tspan></tspan>
<tspan x="16" y="588"><tspan fill="#cf222e">end</tspan> <tspan fill="#8250df">Program</tspan>;</tspan>
</text>
</svg>
